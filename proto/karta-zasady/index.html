<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Szkic: zasady na karcie Telemarka</title>
<!-- Szkic (Mateusz 14.11): gdzie napisać „tydzień 5 najlepszych dni z 7, miesiąc 20, rok 200”. Zrzuty prawdziwej strony
     testowej z ?tmdemo (zrzuty.mjs), w każdej wersji przestawiony tylko opis zasad. -->
<style>
  body { margin:0; background:#111; color:#eee; font-family:Arial, sans-serif; }
  main { display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:28px 36px; padding:24px 36px; }
  figure { margin:0; }
  figcaption { font-size:22px; margin-bottom:8px; }
  figcaption small { display:block; font-size:15px; color:#aaa; margin-top:4px; }
  img { width:100%; height:auto; display:block; border-radius:10px; }
  p.note { margin:0 36px; padding-top:20px; color:#aaa; font-size:15px; }
</style>
</head>
<body>
<p class="note">Kółko z awatarem na niektórych kartach to spadający awatar z mini-gry strony, nie część wersji. Dane przykładowe.</p>
<main>
  <figure><figcaption>Obecnie<small>Wszystko w jednym zdaniu obok przycisku.</small></figcaption><img src="zrzuty/0-obecnie.png" alt="Obecna karta"></figure>
  <figure><figcaption>A: w karcie mistrza<small>Pod „Mistrz roku / miesiąca / tygodnia” jedna szara linijka, jak liczy się ten puchar.</small></figcaption><img src="zrzuty/A-w-karcie-mistrza.png" alt="Wersja A"></figure>
  <figure><figcaption>B: w wyścigu<small>Linijka pod nazwą wyścigu na dole; karty mistrzów bez zmian.</small></figcaption><img src="zrzuty/B-w-wyscigu.png" alt="Wersja B"></figure>
  <figure><figcaption>C: trzy okienka u góry<small>Obok przycisku trzy kolorowe okienka w kolorach pucharów.</small></figcaption><img src="zrzuty/C-trzy-okienka-u-gory.png" alt="Wersja C"></figure>
</main>
</body>
</html>
